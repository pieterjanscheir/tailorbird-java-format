name: Upstream sync

# Opens a pull request when palantir-java-format publishes a new release, or an issue when merging it conflicts.
on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday morning
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag or branch to merge (empty = latest release)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: upstream-sync

jobs:
  sync:
    name: Merge latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request
      issues: write # report conflicts
      actions: write # start CI on the sync branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # For ./gradlew format, which tidies upstream code after tailorbird-rename.sh.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Merge upstream and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.ref }}
        # The checkout keeps no credentials, so git fetches and pushes through the gh token from this step on.
        run: |
          gh auth setup-git
          .github/scripts/upstream-sync.sh "$UPSTREAM_REF"
